#   docker compose -f jenkins/docker-compose.yml up -d --build
#   docker compose -f jenkins/docker-compose.yml logs -f jenkins   # initial admin password
services:
  jenkins:
    build: .
    image: lesson26-jenkins
    container_name: lesson26-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"   # web UI
      - "50000:50000" # inbound agents
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
